name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    name: core + cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all --check
      - name: rustfmt (app crate, not in the workspace)
        if: runner.os == 'Linux'
        run: rustfmt --check --edition 2021 --config-path rustfmt.toml app/src-tauri/src/*.rs
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: UI tests (React + jsdom)
        working-directory: app
        run: |
          npm ci
          npm test
      - name: UI build (TypeScript + Vite)
        working-directory: app
        run: npm run build
      - name: engine smoke test (real conversions)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libvips-tools ghostscript gsfonts qpdf 7zip pandoc tesseract-ocr tesseract-ocr-eng libheif-plugin-aomenc libimage-exiftool-perl zbar-tools qrencode
          cargo build -p zeidex-cli
          bash packaging/smoke.sh target/debug/zeidex-convert

  # --- Android: APK (the app lives in the android/ submodule) ---
  android-apk:
    name: package (Android APK)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      # The Android app is a separate private repository. GitHub's default token only reaches
      # this repository, so the clone needs a PAT secret with Contents: read on the Android repo.
      # Without it the job reports a warning and skips instead of failing the whole workflow.
      - name: Check out the Android submodule
        id: sub
        env:
          SUBMODULE_TOKEN: ${{ secrets.ANDROID_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set +e
          git -c url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf="https://github.com/" \
            submodule update --init --recursive android
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Android APK skipped::android/ is a private submodule. Add an ANDROID_SUBMODULE_TOKEN secret (fine-grained PAT, Contents: read on zeiad6/zeidex-convert-android) to build the APK in CI."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.sub.outputs.ok == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - if: steps.sub.outputs.ok == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Unit tests
        if: steps.sub.outputs.ok == 'true'
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain
      - name: Build APK
        if: steps.sub.outputs.ok == 'true'
        working-directory: android
        run: |
          if [ -f keystore/release.keystore ]; then
            gradle :app:assembleRelease --no-daemon --console=plain
          else
            gradle :app:assembleDebug --no-daemon --console=plain
          fi
      # Artifacts are for inspecting pull requests. A run on main would burn the account's
      # artifact quota every push without anyone downloading the result.
      - if: steps.sub.outputs.ok == 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: zeidex-convert-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # --- Linux: deb + rpm + AppImage (the universal, distro-independent package) ---
  # Built on ubuntu-22.04 on purpose: the AppImage inherits the runner's glibc (2.35), which is
  # the oldest LTS still available and runs on Debian 12+, Ubuntu 22.04+, Fedora 36+, Mint 21+
  # and anything newer. A build on 24.04 would demand glibc 2.39 and refuse to start on those.
  linux-bundles:
    name: package (Linux deb · rpm · AppImage)
    needs: core
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: app/src-tauri
      - name: Build UI
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libxtst-dev libx11-dev patchelf file rpm libfuse2
      # A stock runner has ~14 GB free and the payload is written several times (target dir,
      # AppDir, squashfs). The image ships toolchains this build never touches; removing them
      # keeps the bundler from failing at the last step with ENOSPC.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /
      - name: Fetch engines (Linux)
        run: bash packaging/fetch-engines.sh
      - name: Clippy (app crate)
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Build deb, rpm and AppImage
        working-directory: app
        run: npx tauri build --bundles deb,rpm,appimage
      - name: Checksums
        run: |
          cd app/src-tauri/target/release/bundle
          find . -maxdepth 2 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec sha256sum {} \; | sed 's|  \./|  |' > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
      - name: Upload Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: zeidex-convert-Linux
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/SHA256SUMS-linux.txt
          if-no-files-found: ignore
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Five jobs may reach this line at the same time on a tag push; the last view
          # succeeds when another job created the release a moment earlier.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Zeidex Convert $TAG" --generate-notes || \
            gh release view "$TAG" >/dev/null
          gh release upload "$TAG" \
            app/src-tauri/target/release/bundle/deb/*.deb \
            app/src-tauri/target/release/bundle/rpm/*.rpm \
            app/src-tauri/target/release/bundle/appimage/*.AppImage \
            app/src-tauri/target/release/bundle/SHA256SUMS-linux.txt --clobber

  # --- Linux: Flatpak (distro-independent, sandboxed, updates through the remote) ---
  linux-flatpak:
    name: package (Linux Flatpak)
    needs: core
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: app/src-tauri
      - name: Build UI
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libxtst-dev libx11-dev patchelf flatpak flatpak-builder elfutils
      # The Flatpak export writes the app three times (rofiles, repo, bundle). Without this the
      # runner reaches "min-free-space-percent '3%' would be exceeded" after a full build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /
      - name: Fetch engines (Linux)
        run: bash packaging/fetch-engines.sh
      - name: Build Linux Binary
        working-directory: app/src-tauri
        run: cargo build --release
      - name: Cache Flatpak runtimes
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtime-gnome-46
      - name: Build Flatpak Bundle
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user --noninteractive flathub org.gnome.Platform//46 org.gnome.Sdk//46
          bash packaging/build-flatpak.sh
          sha256sum ZeidexConvert.flatpak > SHA256SUMS-flatpak.txt
      - name: Upload Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: zeidex-convert-Flatpak
          path: |
            ZeidexConvert.flatpak
            SHA256SUMS-flatpak.txt
          if-no-files-found: ignore
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Five jobs may reach this line at the same time on a tag push; the last view
          # succeeds when another job created the release a moment earlier.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Zeidex Convert $TAG" --generate-notes || \
            gh release view "$TAG" >/dev/null
          gh release upload "$TAG" ZeidexConvert.flatpak SHA256SUMS-flatpak.txt --clobber

  # --- Windows: MSI (Group Policy / Intune) and NSIS setup (works on every Windows) ---
  windows-installers:
    name: package (Windows MSI + setup)
    needs: core
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: app/src-tauri
      - name: Build UI (Windows)
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Fetch engines (Windows)
        shell: pwsh
        run: ./packaging/fetch-engines.ps1
      - name: Build MSI and NSIS setup
        working-directory: app
        run: npx tauri build --bundles msi,nsis
      - name: Checksums
        shell: bash
        run: |
          cd app/src-tauri/target/release/bundle
          find . -maxdepth 2 -type f \( -name '*.msi' -o -name '*-setup.exe' \) \
            -exec sha256sum {} \; | sed 's|  \./|  |' > SHA256SUMS-windows.txt
          cat SHA256SUMS-windows.txt
      - name: Upload Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: zeidex-convert-Windows
          path: |
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*-setup.exe
            app/src-tauri/target/release/bundle/SHA256SUMS-windows.txt
          if-no-files-found: ignore
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Five jobs may reach this line at the same time on a tag push; the last view
          # succeeds when another job created the release a moment earlier.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Zeidex Convert $TAG" --generate-notes || \
            gh release view "$TAG" >/dev/null
          gh release upload "$TAG" \
            app/src-tauri/target/release/bundle/msi/*.msi \
            app/src-tauri/target/release/bundle/nsis/*-setup.exe \
            app/src-tauri/target/release/bundle/SHA256SUMS-windows.txt --clobber

  # --- macOS: DMG for Apple Silicon (macos-latest) and Intel (macos-15-intel) ---
  macos-dmg:
    name: package (macOS DMG, ${{ matrix.arch }})
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: app/src-tauri
      - name: Build UI
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Fetch engines (macOS)
        run: bash packaging/fetch-engines.sh
      - name: Build app and DMG
        working-directory: app
        run: npx tauri build --bundles app,dmg
      - name: Checksums
        run: |
          cd app/src-tauri/target/release/bundle
          find . -maxdepth 2 -type f -name '*.dmg' -exec shasum -a 256 {} \; \
            | sed 's|  \./|  |' > SHA256SUMS-macos-${{ matrix.arch }}.txt
          cat SHA256SUMS-macos-${{ matrix.arch }}.txt
      - name: Upload Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: zeidex-convert-macOS-${{ matrix.arch }}
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: ignore
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Five jobs may reach this line at the same time on a tag push; the last view
          # succeeds when another job created the release a moment earlier.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Zeidex Convert $TAG" --generate-notes || \
            gh release view "$TAG" >/dev/null
          gh release upload "$TAG" \
            app/src-tauri/target/release/bundle/dmg/*.dmg \
            app/src-tauri/target/release/bundle/SHA256SUMS-macos-${{ matrix.arch }}.txt --clobber

  # --- CLI: standalone binaries for Linux (x64 + arm64), macOS and Windows ---
  cli-binaries:
    name: cli (${{ matrix.target }})
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            apt: ""
          # The ARM64 CLI is cross-compiled from the x64 runner; zeidex-core has no C
          # dependencies, so a linker is the only extra requirement.
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            apt: gcc-aarch64-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            apt: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            apt: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: Cross linker (Linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
      - name: Build CLI
        shell: bash
        run: cargo build --release -p zeidex-cli --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          NAME="zeidex-convert-${VERSION}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/zeidex-convert" "dist/${NAME}"
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          rm "dist/${NAME}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum *.tar.gz > "SHA256SUMS-cli-${NAME}.txt"
          else
            shasum -a 256 *.tar.gz > "SHA256SUMS-cli-${NAME}.txt"
          fi
          cat "SHA256SUMS-cli-${NAME}.txt"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          $name = "zeidex-convert-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/zeidex-convert.exe" "dist/$name.exe"
          Compress-Archive -Path "dist/$name.exe" -DestinationPath "dist/$name.zip" -Force
          Remove-Item "dist/$name.exe"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "dist/SHA256SUMS-cli-$name.txt"
          Get-Content "dist/SHA256SUMS-cli-$name.txt"
      - name: Upload Artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: zeidex-convert-CLI-${{ matrix.target }}
          path: dist/*
          if-no-files-found: ignore
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Five jobs may reach this line at the same time on a tag push; the last view
          # succeeds when another job created the release a moment earlier.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Zeidex Convert $TAG" --generate-notes || \
            gh release view "$TAG" >/dev/null
          gh release upload "$TAG" dist/* --clobber
