name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    name: core + cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: rustfmt (app crate, not in the workspace)
        if: runner.os == 'Linux'
        run: rustfmt --check --edition 2021 --config-path rustfmt.toml app/src-tauri/src/*.rs
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: UI scripts (fake DOM, no deps)
        run: node app/ui/test/ui.test.js
      - name: engine smoke test (real conversions)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libvips-tools ghostscript gsfonts qpdf 7zip pandoc tesseract-ocr tesseract-ocr-eng libheif-plugin-aomenc libimage-exiftool-perl zbar-tools qrencode
          cargo build -p zeidex-cli
          bash packaging/smoke.sh target/debug/zeidex

  app:
    name: app (${{ matrix.os }})
    needs: core
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # --- Linux dependencies & engines ---
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libxtst-dev libx11-dev patchelf flatpak flatpak-builder elfutils
      - name: Fetch engines (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/fetch-engines.sh

      # --- Windows dependencies & engines ---
      - name: Fetch engines (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/fetch-engines.ps1

      # --- Windows Build (MSI & NSIS EXE) ---
      - name: Install Tauri CLI (Windows)
        if: runner.os == 'Windows'
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build Windows Bundles (MSI & EXE)
        if: runner.os == 'Windows'
        working-directory: app/src-tauri
        run: cargo tauri build

      # --- Linux Build (Flatpak bundle) ---
      - name: Build Linux Binary
        if: runner.os == 'Linux'
        working-directory: app/src-tauri
        run: cargo build --release
      - name: Build Flatpak Bundle
        if: runner.os == 'Linux'
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.repo
          flatpak install -y --user --noninteractive flathub org.gnome.Platform//46 org.gnome.Sdk//46
          bash packaging/build-flatpak.sh

      # --- Artifact Upload (non-blocking if storage quota exceeded) ---
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: zeidex-convert-${{ runner.os }}
          path: |
            app/src-tauri/target/release/bundle/**/*.exe
            app/src-tauri/target/release/bundle/**/*.msi
            ZeidexConvert.flatpak
          if-no-files-found: ignore

      # --- Release Asset Upload (Direct to GitHub Release, bypasses Actions quota) ---
      - name: Publish Package to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="v0.1.0"
          gh release view "$TAG" || gh release create "$TAG" --title "Zeidex Convert $TAG" --notes "Official Release Packages for $TAG" || true
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "Uploading Windows MSI and EXE packages to $TAG..."
            gh release upload "$TAG" app/src-tauri/target/release/bundle/msi/*.msi app/src-tauri/target/release/bundle/nsis/*.exe --clobber
          else
            if [ -f "ZeidexConvert.flatpak" ]; then
              echo "Uploading Linux Flatpak bundle to $TAG..."
              gh release upload "$TAG" ZeidexConvert.flatpak --clobber
            fi
          fi
