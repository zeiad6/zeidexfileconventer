name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: core + cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: rustfmt (app crate, not in the workspace)
        if: runner.os == 'Linux'
        run: rustfmt --check --edition 2021 --config-path rustfmt.toml app/src-tauri/src/*.rs
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: UI scripts (fake DOM, no deps)
        run: node app/ui/test/ui.test.js
      - name: engine smoke test (real conversions)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libvips-tools ghostscript qpdf 7zip pandoc tesseract-ocr tesseract-ocr-eng libheif-plugins-all libimage-exiftool-perl zbar-tools qrencode
          cargo build -p zeidex-cli
          bash packaging/smoke.sh target/debug/zeidex

  app:
    name: app (${{ matrix.os }})
    needs: core
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libxtst-dev libx11-dev patchelf
      - name: Fetch engines (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/fetch-engines.sh
      - name: Fetch engines (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/fetch-engines.ps1
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Build bundles
        working-directory: app/src-tauri
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: zeidex-convert-${{ runner.os }}
          path: |
            app/src-tauri/target/release/bundle/**/*.exe
            app/src-tauri/target/release/bundle/**/*.msi
            app/src-tauri/target/release/bundle/**/*.deb
            app/src-tauri/target/release/bundle/**/*.rpm
            app/src-tauri/target/release/bundle/**/*.AppImage
          if-no-files-found: error

  release:
    name: publish release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
