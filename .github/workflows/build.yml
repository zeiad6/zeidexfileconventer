name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    name: core + cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo fmt --all --check
      - name: rustfmt (app crate, not in the workspace)
        if: runner.os == 'Linux'
        run: rustfmt --check --edition 2021 --config-path rustfmt.toml app/src-tauri/src/*.rs
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: UI scripts (fake DOM, no deps)
        run: node app/ui/test/ui.test.js
      - name: engine smoke test (real conversions)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libvips-tools ghostscript gsfonts qpdf 7zip pandoc tesseract-ocr tesseract-ocr-eng libheif-plugin-aomenc libimage-exiftool-perl zbar-tools qrencode
          cargo build -p zeidex-cli
          bash packaging/smoke.sh target/debug/zeidex-convert

  # --- Android: APK (the app lives in the android/ submodule) ---
  android-apk:
    name: package (Android APK)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon --console=plain
      - name: Build APK
        working-directory: android
        run: |
          if [ -f keystore/release.keystore ]; then
            gradle :app:assembleRelease --no-daemon --console=plain
          else
            gradle :app:assembleDebug --no-daemon --console=plain
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zeidex-convert-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # --- Linux: Flatpak Package Only ---
  linux-flatpak:
    name: package (Linux Flatpak)
    needs: core
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: app/src-tauri
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libxtst-dev libx11-dev patchelf flatpak flatpak-builder elfutils
      - name: Fetch engines (Linux)
        run: bash packaging/fetch-engines.sh
      - name: Clippy (app crate)
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Build Linux Binary
        working-directory: app/src-tauri
        run: cargo build --release
      - name: Cache Flatpak runtimes
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-runtime-gnome-46
      - name: Build Flatpak Bundle
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user --noninteractive flathub org.gnome.Platform//46 org.gnome.Sdk//46
          bash packaging/build-flatpak.sh
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: zeidex-convert-Flatpak
          path: ZeidexConvert.flatpak
          if-no-files-found: ignore
      - name: Publish Flatpak to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="v0.1.0"
          gh release view "$TAG" || gh release create "$TAG" --title "Zeidex Convert $TAG" --notes "Official Packages: Windows MSI & Linux Flatpak" || true
          if [ -f "ZeidexConvert.flatpak" ]; then
            echo "Uploading Linux Flatpak bundle to $TAG..."
            gh release upload "$TAG" ZeidexConvert.flatpak --clobber
          fi

  # --- Windows: MSI Package Only ---
  windows-msi:
    name: package (Windows MSI)
    needs: core
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: app/src-tauri
      - name: Fetch engines (Windows)
        shell: pwsh
        run: ./packaging/fetch-engines.ps1
      - name: Install Tauri CLI (Windows)
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build Windows MSI Bundle
        working-directory: app/src-tauri
        run: cargo tauri build --bundles msi
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: zeidex-convert-MSI
          path: app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore
      - name: Publish MSI to GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="v0.1.0"
          gh release view "$TAG" || gh release create "$TAG" --title "Zeidex Convert $TAG" --notes "Official Packages: Windows MSI & Linux Flatpak" || true
          echo "Uploading Windows MSI package to $TAG..."
          gh release upload "$TAG" app/src-tauri/target/release/bundle/msi/*.msi --clobber
