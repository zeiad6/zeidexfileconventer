# Built from the release .deb so the snap carries the same binary as every other Linux package.
# Build: cd packaging/linux/snap && snapcraft   (LXD), or `snapcraft --destructive-mode` on core22.
name: zeidex-convert
base: core22
version: '0.2.0'
summary: Offline file converter with a radial drag-and-drop wheel
description: |
  Convert images, audio, video, documents, subtitles and archives without uploading
  anything. Drag files, tap Shift/Ctrl/Alt to open the Convert, Tools or Actions ring,
  park files on the floating shelf, or script it all with the zeidex-convert CLI.
grade: stable
confinement: strict
architectures:
  - build-on: amd64

apps:
  zeidex-convert:
    command: usr/bin/zeidex-app
    extensions: [gnome]
    plugs:
      - home
      - removable-media
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - audio-playback

parts:
  zeidex-convert:
    plugin: dump
    source: https://github.com/zeiad6/zeidexfileconventer/releases/download/v0.2.0/Zeidex.Convert_0.2.0_amd64.deb
    source-type: deb
    source-checksum: sha256/728b72497c9ca4559b977457eece26506668d790e1c7eb8dabb47bdaa6bb27fc
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
      - ffmpeg
      - p7zip-full
