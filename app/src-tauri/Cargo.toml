[package]
name = "zeidex-app"
description = "Zeidex Convert desktop app (Windows, Linux)"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

# Standalone workspace: keeps the dependency-free core buildable offline (see ../../Cargo.toml).
[workspace]

[lib]
name = "zeidex_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = "0.5"
zeidex-core = { path = "../../crates/core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
