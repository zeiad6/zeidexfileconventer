[package]
name = "zeidex-app"
description = "Zeidex Convert desktop app (Windows, macOS, Linux)"
version = "0.3.2"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/zeiad6/zeidexfileconventer"

# Standalone workspace: keeps the dependency-free core buildable offline (see ../../Cargo.toml).
[workspace]

[lib]
name = "zeidex_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = "0.5"
zeidex-core = { path = "../../crates/core" }
zeidex-localdrop = { path = "../../crates/localdrop" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_DataExchange",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
