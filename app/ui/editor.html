<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Zeidex — editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="editor">
  <header class="ebar">
    <strong id="title"></strong>
    <div id="controls" class="controls"></div>
    <span class="spacer"></span>
    <button id="undo" data-t="undo"></button>
    <button id="cancel" data-t="cancel"></button>
    <button id="apply" class="primary" data-t="apply"></button>
  </header>
  <p class="err" id="err" role="alert"></p>
  <div class="stage"><canvas id="canvas"></canvas></div>
  <p class="hint" id="info"></p>
  <script src="common.js"></script>
  <script src="editor.js"></script>
</body>
</html>
