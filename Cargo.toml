# The Tauri app (app/src-tauri) is its own workspace on purpose: core and cli have zero
# dependencies, so they build and test fully offline without resolving the GUI crate graph.
[workspace]
members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.3.5"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/zeiad6/zeidexfileconventer"
authors = ["Zeidexsoft"]
