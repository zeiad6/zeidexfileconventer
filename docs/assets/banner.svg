<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Zeidex Convert — local file converter for Windows, macOS and Linux">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161412"/>
      <stop offset="0.55" stop-color="#1b1815"/>
      <stop offset="1" stop-color="#241d17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#f07b1d" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#f07b1d" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f07b1d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f07b1d"/>
      <stop offset="1" stop-color="#ffb066"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .latin { font-family: 'IBM Plex Sans', 'Noto Sans', sans-serif; }
      .arabic { font-family: 'IBM Plex Sans Arabic', 'Noto Sans Arabic UI', sans-serif; }
      .title { font-size: 72px; font-weight: 700; fill: #f7f3ee; letter-spacing: -1.5px; }
      .kick { font-size: 20px; font-weight: 600; fill: #f0a35f; letter-spacing: 3px; }
      .ar { font-size: 30px; font-weight: 500; fill: #efe9e2; }
      .en { font-size: 19px; font-weight: 400; fill: #a9a095; }
      .chip { font-size: 17px; font-weight: 600; fill: #f5efe7; }
      .pulse { animation: pulse 6s ease-in-out infinite; }
      .drift { animation: drift 14s ease-in-out infinite; }
      .drift2 { animation: drift 18s ease-in-out infinite reverse; }
      @keyframes pulse { 0%,100% { opacity: 0.55 } 50% { opacity: 0.95 } }
      @keyframes drift { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
    </style>
  </defs>

  <rect width="1280" height="400" fill="url(#ink)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <ellipse class="pulse" cx="1010" cy="120" rx="330" ry="220" fill="url(#glow)"/>
  <circle class="drift" cx="1075" cy="205" r="118" fill="none" stroke="#f07b1d" stroke-opacity="0.35" stroke-width="2"/>
  <circle class="drift2" cx="1075" cy="205" r="86" fill="none" stroke="#f7f3ee" stroke-opacity="0.16" stroke-width="1.5"/>

  <g transform="translate(72 86)">
    <text class="latin kick" x="0" y="0">ZEIDEX · LOCAL FIRST</text>
    <text class="latin title" x="0" y="92">Zeidex Convert</text>
    <text class="arabic ar" x="0" y="152">حوّل أي ملف، على جهازك، دون رفع.</text>
    <text class="latin en" x="0" y="192">Drag a file, hold Shift, drop it on a format. Windows · macOS · Linux · Android</text>
  </g>

  <g class="drift">
    <g transform="translate(946 74)">
      <rect width="118" height="46" rx="23" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text class="latin chip" x="59" y="29" text-anchor="middle" fill="#ffb066">MP4</text>
    </g>
    <g transform="translate(1096 132)">
      <rect width="118" height="46" rx="23" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text class="latin chip" x="59" y="29" text-anchor="middle">PDF</text>
    </g>
    <g transform="translate(1024 292)">
      <rect width="118" height="46" rx="23" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text class="latin chip" x="59" y="29" text-anchor="middle">SRT</text>
    </g>
    <g transform="translate(902 232)">
      <rect width="118" height="46" rx="23" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text class="latin chip" x="59" y="29" text-anchor="middle">HEIC</text>
    </g>
    <g transform="translate(1150 240)">
      <rect width="118" height="46" rx="23" fill="url(#chip)" stroke="#ffffff" stroke-opacity="0.12"/>
      <text class="latin chip" x="59" y="29" text-anchor="middle">DOCX</text>
    </g>
  </g>

  <rect x="72" y="322" width="228" height="42" rx="21" fill="#f07b1d"/>
  <text class="latin" x="186" y="349" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">100% offline</text>
  <text class="latin" x="326" y="349" font-size="16" fill="#8f877d">No uploads · no accounts · no telemetry</text>
</svg>
